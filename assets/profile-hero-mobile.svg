  <text x="42" y="187" font-family="Arial,Helvetica,sans-serif" font-size="97" font-weight="700" letter-spacing="-3" fill="#F1F5FA">Sina Fateh</text>
  <text x="46" y="245" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#CAD5E4">From the first endpoint</text>
  <text x="46" y="284" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#CAD5E4">to production.</text>
  <path d="M45 315 H715" stroke="#3B536A" stroke-opacity="0.7"/>
  <text x="46" y="353" font-family="Consolas,'Courier New',monospace" font-size="21" fill="#72D9D0">PYTHON</text>
  <text x="164" y="353" font-family="Consolas,'Courier New',monospace" font-size="21" fill="#879DB7">/</text>
  <text x="187" y="353" font-family="Consolas,'Courier New',monospace" font-size="21" fill="#B3A0FF">ASP.NET CORE</text>
  <text x="392" y="353" font-family="Consolas,'Courier New',monospace" font-size="21" fill="#879DB7">/</text>
  <text x="417" y="353" font-family="Consolas,'Courier New',monospace" font-size="21" fill="#C7D8EA">DOCKER</text>
  <text x="46" y="398" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#8299B2">Design. Build. Deploy. Maintain.</text>
