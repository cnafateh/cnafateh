<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Sina Fateh — Backend Engineer</title>
  <desc id="desc">A responsive dark profile header for mobile, highlighting backend engineering, Python, ASP.NET Core and infrastructure.</desc>
  <defs>
  <style><![CDATA[
    /* A lightweight motion layer for narrow displays. */
    .accent-sweep { animation:sweep-mobile 9s ease-in-out infinite; }
    .status-ring { transform-origin:49px 63px; animation:status-ping 3.2s ease-out infinite; }
    .status-dot { animation:status-breathe 3.2s ease-in-out infinite; }
    .intro-name { animation:reveal .9s cubic-bezier(.2,.8,.2,1) both; }
    .intro-tagline { animation:reveal .9s .17s cubic-bezier(.2,.8,.2,1) both; }
    .intro-stack { animation:reveal .9s .34s ease-out both; }
    .mobile-caret { animation:cursor-blink 1.1s steps(1,end) infinite; }
    @keyframes sweep-mobile { 0%,12% { transform:translateX(0); opacity:0; } 22%,55% { opacity:.85; } 74%,100% { transform:translateX(1000px); opacity:0; } }
    @keyframes status-ping { 0% { transform:scale(.45); opacity:.5; } 65%,100% { transform:scale(2.15); opacity:0; } }
    @keyframes status-breathe { 0%,100% { opacity:1; } 50% { opacity:.65; } }
    @keyframes reveal { from { transform:translateY(8px); opacity:0; } to { transform:translateY(0); opacity:1; } }
    @keyframes cursor-blink { 0%,49% { opacity:.93; } 50%,100% { opacity:0; } }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } .status-ring { opacity:0; } .accent-sweep { opacity:0; } }
  ]]></style>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A101D"/><stop offset="1" stop-color="#101325"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#35D4CB"/><stop offset="0.52" stop-color="#5FA8FF"/><stop offset="1" stop-color="#A48AFF"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#A3BCD7" opacity="0.13"/></pattern>
      <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#E2FCFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="760" height="430" rx="18" fill="url(#surface)"/>
  <rect width="760" height="430" rx="18" fill="url(#dots)"/>
  <rect width="760" height="5" rx="2.5" fill="url(#line)"/>
  <g class="accent-sweep"><rect x="-245" y="0" width="245" height="5" fill="url(#sweepGrad)"/></g>
  <circle class="status-ring" cx="49" cy="63" r="8" fill="none" stroke="#37D9C8" stroke-width="1.5"/>
  <rect class="status-dot" x="44" y="58" width="10" height="10" rx="5" fill="#37D9C8"/>
  <text x="70" y="69" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="2.1" fill="#91B9C8">BACKEND ENGINEERING</text>
  <text class="intro-name" x="42" y="187" font-family="Arial,Helvetica,sans-serif" font-size="97" font-weight="700" letter-spacing="-3" fill="#F1F5FA">Sina Fateh</text>
  <text class="intro-tagline" x="46" y="245" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#CAD5E4">From the first endpoint</text>
  <text class="intro-tagline" x="46" y="284" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#CAD5E4">to production.</text>
  <path d="M45 315 H715" stroke="#3B536A" stroke-opacity="0.7"/>
  <text class="intro-stack" x="46" y="353" font-family="Consolas,'Courier New',monospace" font-size="21" fill="#72D9D0">PYTHON</text>
  <text class="intro-stack" x="164" y="353" font-family="Consolas,'Courier New',monospace" font-size="21" fill="#879DB7">/</text>
  <text class="intro-stack" x="187" y="353" font-family="Consolas,'Courier New',monospace" font-size="21" fill="#B3A0FF">ASP.NET CORE</text>
  <text class="intro-stack" x="392" y="353" font-family="Consolas,'Courier New',monospace" font-size="21" fill="#879DB7">/</text>
  <text class="intro-stack" x="417" y="353" font-family="Consolas,'Courier New',monospace" font-size="21" fill="#C7D8EA">DOCKER</text>
  <text x="46" y="398" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#8299B2">Design. Build. Deploy. Maintain.</text>
  <rect class="mobile-caret" x="680" y="375" width="9" height="22" rx="1" fill="#72D9D0"/>
</svg>
