<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Sina Fateh — Backend Engineer</title>
  <desc id="desc">A responsive dark profile header for mobile, highlighting backend engineering, Python, ASP.NET Core and infrastructure.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A101D"/><stop offset="1" stop-color="#101325"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#35D4CB"/><stop offset="0.52" stop-color="#5FA8FF"/><stop offset="1" stop-color="#A48AFF"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#A3BCD7" opacity="0.13"/></pattern>
  </defs>
  <rect width="760" height="430" rx="18" fill="url(#surface)"/>
  <rect width="760" height="430" rx="18" fill="url(#dots)"/>
  <rect width="760" height="5" rx="2.5" fill="url(#line)"/>
  <rect x="44" y="58" width="10" height="10" rx="5" fill="#37D9C8"/>
