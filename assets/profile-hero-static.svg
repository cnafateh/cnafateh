<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Sina Fateh — Backend Engineer</title>
  <desc id="desc">A dark, understated profile header with technical details about backend systems, ASP.NET Core, Python, Docker, and Linux.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A101D"/><stop offset="0.55" stop-color="#0D1726"/><stop offset="1" stop-color="#101325"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#35D4CB"/><stop offset="0.52" stop-color="#5FA8FF"/><stop offset="1" stop-color="#A48AFF"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5F5CDB" stop-opacity="0.2"/><stop offset="1" stop-color="#5F5CDB" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="29" height="29" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#A3BCD7" opacity="0.14"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#surface)"/>
  <rect width="1200" height="360" rx="20" fill="url(#dots)"/>
  <circle cx="1090" cy="36" r="330" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="5" rx="2.5" fill="url(#line)"/>
  <rect x="58" y="53" width="9" height="9" rx="4.5" fill="#37D9C8"/>
  <text x="78" y="62" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="2.1" fill="#91B9C8">BACKEND ENGINEERING  /  SOFTWARE SYSTEMS</text>
  <text x="57" y="156" font-family="Arial,Helvetica,sans-serif" font-size="75" font-weight="700" letter-spacing="-2.5" fill="#F1F5FA">Sina Fateh</text>
  <text x="60" y="212" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#CAD5E4">From the first endpoint to production.</text>
  <line x1="60" y1="249" x2="638" y2="249" stroke="#3B536A" stroke-opacity="0.6"/>
  <text x="60" y="283" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#72D9D0">PYTHON / DJANGO</text>
  <text x="263" y="283" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#879DB7">·</text>
  <text x="284" y="283" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#B3A0FF">C# / .NET</text>
  <text x="417" y="283" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#879DB7">·</text>
  <text x="440" y="283" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#C7D8EA">DOCKER / LINUX</text>
  <text x="60" y="321" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#7F95AD">Design. Build. Deploy. Maintain.</text>
  <!-- A decorative code window: no runtime claims or fake activity metrics. -->
  <rect x="729" y="55" width="414" height="251" rx="16" fill="#0B1423" stroke="#35506A" stroke-opacity="0.92" stroke-width="1.5"/>
  <path d="M730 101 H1142" stroke="#35506A" stroke-opacity="0.82"/>
  <circle cx="754" cy="78" r="5" fill="#ED7982"/>
  <circle cx="775" cy="78" r="5" fill="#F0C46A"/>
  <circle cx="796" cy="78" r="5" fill="#4FC8A9"/>
  <text x="933" y="83" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8399B2">profile.ts</text>
  <text x="755" y="135" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#899AB1">01</text>
  <text x="795" y="135" font-family="Consolas,'Courier New',monospace" font-size="17"><tspan fill="#A88EFF">const</tspan><tspan fill="#E2E9F3"> engineer = {</tspan></text>
  <text x="755" y="172" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#899AB1">02</text>
  <text x="814" y="172" font-family="Consolas,'Courier New',monospace" font-size="17"><tspan fill="#99C6FF">focus</tspan><tspan fill="#E2E9F3">: </tspan><tspan fill="#70D8C9">'backend systems'</tspan><tspan fill="#E2E9F3">,</tspan></text>
  <text x="755" y="209" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#899AB1">03</text>
  <text x="814" y="209" font-family="Consolas,'Courier New',monospace" font-size="17"><tspan fill="#99C6FF">runtime</tspan><tspan fill="#E2E9F3">: </tspan><tspan fill="#70D8C9">'production'</tspan><tspan fill="#E2E9F3">,</tspan></text>
  <text x="755" y="246" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#899AB1">04</text>
  <text x="814" y="246" font-family="Consolas,'Courier New',monospace" font-size="17"><tspan fill="#99C6FF">approach</tspan><tspan fill="#E2E9F3">: </tspan><tspan fill="#70D8C9">'end-to-end'</tspan></text>
  <text x="755" y="282" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#899AB1">05</text>
  <text x="795" y="282" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#E2E9F3">};</text>
</svg>
